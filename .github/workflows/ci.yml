name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  smash2:
    name: smash2 (Rust)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: reimplementation/adl2
    steps:
      - uses: actions/checkout@v4
      # Pinned to the version the snapshot corpus was generated with:
      # witness models in rendered reports are solver-version-dependent.
      - name: Install z3 4.12.2
        run: |
          curl -sSL -o /tmp/z3.zip https://github.com/Z3Prover/z3/releases/download/z3-4.12.2/z3-4.12.2-x64-glibc-2.35.zip
          unzip -q /tmp/z3.zip -d /tmp/z3
          sudo install /tmp/z3/z3-4.12.2-x64-glibc-2.35/bin/z3 /usr/local/bin/z3
          z3 --version
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: reimplementation/adl2
      - name: Build
        run: cargo build --release --workspace
      - name: Test
        run: cargo test --release --workspace

  legacy:
    name: legacy smash (C++)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y flex bison libfl-dev clang graphviz z3
      - name: Build
        run: make
      - name: Golden suite + corpus sweep + z3 spike
        run: make -C legacy_parser test

  # P3 C++ syntax + sema + formula/interp/axioms (ADR-010). Stock cmake + g++;
  # no bison/flex. Dump-diff / run-diff gates build Rust smash2 as forever
  # oracle (--no-default-features so the job does not need libz3).
  adl2-cpp:
    name: adl2-cpp (P3 dump-ast + dump-hir + formula + interp gates)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ make
      - uses: dtolnay/rust-toolchain@1.93.0
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: reimplementation/adl2
      - name: Configure C++
        run: cmake -S cpp -B cpp/build -DCMAKE_BUILD_TYPE=Release
      - name: Build C++
        run: cmake --build cpp/build -j$(nproc)
      - name: C++ unit/smoke tests
        run: ctest --test-dir cpp/build --output-on-failure
      - name: Dump-ast corpus gate (vs Rust smash2)
        run: cpp/scripts/dump_ast_corpus_gate.sh
      - name: Dump-hir/quantities oracle gate (vs Rust smash2)
        run: SKIP_BUILD=1 cpp/scripts/dump_hir_corpus_gate.sh
      - name: Dump-formula oracle gate (vs Rust smash2)
        run: SKIP_BUILD=1 cpp/scripts/dump_formula_corpus_gate.sh
      - name: Interpreter run oracle gate (vs Rust smash2)
        run: SKIP_BUILD=1 cpp/scripts/interp_run_gate.sh

  # Rust smash2 is the forever oracle for the C++ port (ADR-010).
  # Keep this green alongside adl2-cpp; do not remove or weaken it.
  # Does not replace the full `smash2` workspace job.
  oracle-rust:
    name: oracle-rust (smash2 forever-oracle)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: reimplementation/adl2
    steps:
      - uses: actions/checkout@v4
      - name: Install z3 4.12.2
        run: |
          curl -sSL -o /tmp/z3.zip https://github.com/Z3Prover/z3/releases/download/z3-4.12.2/z3-4.12.2-x64-glibc-2.35.zip
          unzip -q /tmp/z3.zip -d /tmp/z3
          sudo install /tmp/z3/z3-4.12.2-x64-glibc-2.35/bin/z3 /usr/local/bin/z3
          z3 --version
      - uses: dtolnay/rust-toolchain@1.93.0
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: reimplementation/adl2
      - name: Build smash2 (oracle)
        run: cargo build --release -p adl-cli
      - name: Oracle check on tutorial fixture
        run: |
          ./target/release/smash2 check --dump-ast \
            ../../examples/tutorials/ex01_selection.adl
