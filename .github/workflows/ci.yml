name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  smash2:
    name: smash2 (Rust)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: reimplementation/adl2
    steps:
      - uses: actions/checkout@v4
      # Pinned to the version the snapshot corpus was generated with:
      # witness models in rendered reports are solver-version-dependent.
      - name: Install z3 4.12.2
        run: |
          curl -sSL -o /tmp/z3.zip https://github.com/Z3Prover/z3/releases/download/z3-4.12.2/z3-4.12.2-x64-glibc-2.35.zip
          unzip -q /tmp/z3.zip -d /tmp/z3
          sudo install /tmp/z3/z3-4.12.2-x64-glibc-2.35/bin/z3 /usr/local/bin/z3
          z3 --version
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: reimplementation/adl2
      - name: Build
        run: cargo build --release --workspace
      - name: Test
        # `prop_encoder_vs_interp` can flake on the known-open SOUNDNESS_PROOF
        # §8 1c (unindexed WholeDR false PROVEN SUBSET). That is not a
        # dump-formula regression. Do not skip the test or lower PROPTEST_CASES.
        run: cargo test --release --workspace

  legacy:
    name: legacy smash (C++)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y flex bison libfl-dev clang graphviz z3
      - name: Build
        run: make
      - name: Golden suite + corpus sweep + z3 spike
        run: make -C legacy_parser test

  # Standalone C++ toolchain (ADR-010). Stock cmake + g++; no bison/flex,
  # no libz3, no Rust/cargo. Dump scripts check C++ well-formedness.
  # Optional smash2 byte-diff is CROSS_ORACLE=1 (job adl2-cpp-cross).
  adl2-cpp:
    name: adl2-cpp (standalone build + ctest + corpus dumps)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ make
      - name: Install z3 4.12.2 (subprocess solver tests)
        run: |
          curl -sSL -o /tmp/z3.zip https://github.com/Z3Prover/z3/releases/download/z3-4.12.2/z3-4.12.2-x64-glibc-2.35.zip
          unzip -q /tmp/z3.zip -d /tmp/z3
          sudo install /tmp/z3/z3-4.12.2-x64-glibc-2.35/bin/z3 /usr/local/bin/z3
          z3 --version
      - name: Configure C++
        run: cmake -S cpp -B cpp/build -DCMAKE_BUILD_TYPE=Release
        env:
          CXX: g++
      - name: Build C++
        run: cmake --build cpp/build -j$(nproc)
      - name: C++ unit/smoke tests
        run: ctest --test-dir cpp/build --output-on-failure
      - name: Dump-ast corpus (C++ well-formed)
        run: SKIP_BUILD=1 cpp/scripts/dump_ast_corpus_gate.sh
      - name: Dump-hir/quantities corpus (C++ well-formed)
        run: SKIP_BUILD=1 cpp/scripts/dump_hir_corpus_gate.sh
      - name: Dump-formula corpus (C++ well-formed)
        run: SKIP_BUILD=1 cpp/scripts/dump_formula_corpus_gate.sh
      - name: Interpreter run corpus (C++ well-formed)
        run: SKIP_BUILD=1 cpp/scripts/interp_run_gate.sh
      - name: Dump-axioms corpus (C++ well-formed)
        run: SKIP_BUILD=1 cpp/scripts/dump_axioms_corpus_gate.sh
      - name: Dump-objects corpus (C++ well-formed)
        run: SKIP_BUILD=1 cpp/scripts/dump_objects_corpus_gate.sh
      - name: Dump-dot corpus (C++ well-formed)
        run: SKIP_BUILD=1 cpp/scripts/dump_dot_corpus_gate.sh
      - name: Verify golden pins
        run: cpp/tests/verify_goldens.sh cpp/build/smash2_cpp .
      - name: Verify corpus gate (ledger pin)
        run: SKIP_BUILD=1 cpp/scripts/verify_corpus_gate.sh

  # Optional sibling byte-diff: smash2 vs smash2_cpp. Not required to
  # build or test the C++ toolchain. Known HIR/formula/axiom dump
  # wording gaps stay informational so they cannot block merge.
  adl2-cpp-cross:
    name: adl2-cpp-cross (optional smash2 dump-diff)
    continue-on-error: true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ make
      - uses: dtolnay/rust-toolchain@1.93.0
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: reimplementation/adl2
      - name: Configure C++
        run: cmake -S cpp -B cpp/build -DCMAKE_BUILD_TYPE=Release
        env:
          CXX: g++
      - name: Cross-oracle dump-ast
        run: CROSS_ORACLE=1 cpp/scripts/dump_ast_corpus_gate.sh
      - name: Cross-oracle interp run
        run: CROSS_ORACLE=1 SKIP_BUILD=1 cpp/scripts/interp_run_gate.sh
      - name: Cross-oracle verify goldens
        run: CROSS_ORACLE=1 cpp/tests/verify_goldens.sh cpp/build/smash2_cpp .
      - name: Cross-oracle dump-hir (known diagnostic wording gaps)
        continue-on-error: true
        run: CROSS_ORACLE=1 SKIP_BUILD=1 cpp/scripts/dump_hir_corpus_gate.sh
      - name: Cross-oracle dump-formula (known presence/diag text gaps)
        continue-on-error: true
        run: CROSS_ORACLE=1 SKIP_BUILD=1 cpp/scripts/dump_formula_corpus_gate.sh
      - name: Cross-oracle dump-axioms (known PRES on defined(size))
        continue-on-error: true
        run: CROSS_ORACLE=1 SKIP_BUILD=1 cpp/scripts/dump_axioms_corpus_gate.sh
      - name: Cross-oracle dump-objects
        continue-on-error: true
        run: CROSS_ORACLE=1 SKIP_BUILD=1 cpp/scripts/dump_objects_corpus_gate.sh
      - name: Cross-oracle dump-dot
        continue-on-error: true
        run: CROSS_ORACLE=1 SKIP_BUILD=1 cpp/scripts/dump_dot_corpus_gate.sh

  # Rust smash2 CLI smoke (does not replace the full smash2 workspace job).
  oracle-rust:
    name: smash2 CLI smoke
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: reimplementation/adl2
    steps:
      - uses: actions/checkout@v4
      - name: Install z3 4.12.2
        run: |
          curl -sSL -o /tmp/z3.zip https://github.com/Z3Prover/z3/releases/download/z3-4.12.2/z3-4.12.2-x64-glibc-2.35.zip
          unzip -q /tmp/z3.zip -d /tmp/z3
          sudo install /tmp/z3/z3-4.12.2-x64-glibc-2.35/bin/z3 /usr/local/bin/z3
          z3 --version
      - uses: dtolnay/rust-toolchain@1.93.0
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: reimplementation/adl2
      - name: Build smash2 (oracle)
        run: cargo build --release -p adl-cli
      - name: Oracle check on tutorial fixture
        run: |
          ./target/release/smash2 check --dump-ast \
            ../../examples/tutorials/ex01_selection.adl

  # smash_cpp2 vs smash3 oracle. Fail if smash3-production cannot be fetched.
  smash_cpp2:
    name: smash_cpp2
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Grammar check (no ADL parse)
        run: python3 reimplementation/smash_cpp2/scripts/grammar_check.py
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ make
      - name: Install z3 4.12.2
        run: |
          curl -sSL -o /tmp/z3.zip https://github.com/Z3Prover/z3/releases/download/z3-4.12.2/z3-4.12.2-x64-glibc-2.35.zip
          unzip -q /tmp/z3.zip -d /tmp/z3
          sudo install /tmp/z3/z3-4.12.2-x64-glibc-2.35/bin/z3 /usr/local/bin/z3
          z3 --version
      - uses: dtolnay/rust-toolchain@1.93.0
      - name: Fetch smash3 oracle sources
        run: |
          ok=0
          for i in 0 1 2 3; do
            if git fetch origin cursor/smash3-production-9e76; then
              ok=1
              break
            fi
            sleep $((4 * (2 ** i)))
          done
          if [[ "$ok" -ne 1 ]]; then
            echo "failed to fetch origin/cursor/smash3-production-9e76" >&2
            echo "smash_cpp2 gates require the smash3 oracle; do not fall back to smash2" >&2
            exit 1
          fi
          git checkout origin/cursor/smash3-production-9e76 -- reimplementation/smash3
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: reimplementation/smash3
      - name: Build smash3 oracle
        working-directory: reimplementation/smash3
        run: cargo build --release -p adl-cli --no-default-features
      - name: Configure smash_cpp2
        run: cmake -S reimplementation/smash_cpp2 -B reimplementation/smash_cpp2/build -DCMAKE_BUILD_TYPE=Release
        env:
          CXX: g++
      - name: Build smash_cpp2
        run: cmake --build reimplementation/smash_cpp2/build -j$(nproc)
      - name: ldd must not show libz3 or CERN ROOT
        run: |
          bin=reimplementation/smash_cpp2/build/smash_cpp2
          ldd "$bin"
          if ldd "$bin" | grep -E 'libz3|libCore|libRIO'; then
            echo "ldd shows banned library" >&2
            exit 1
          fi
      - name: Run ci_gates.sh
        env:
          root: ${{ github.workspace }}
          cpp2: ${{ github.workspace }}/reimplementation/smash_cpp2/build/smash_cpp2
          smash3: ${{ github.workspace }}/reimplementation/smash3/target/release/smash3
        run: bash reimplementation/smash_cpp2/scripts/ci_gates.sh
